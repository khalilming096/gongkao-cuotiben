<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>公考错题本</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#F3F4F7; --card:#FFFFFF; --ink:#16181D; --ink2:#5B6170; --ink3:#8E95A3;
    --line:#E6E8EE; --accent:#2B5CE6; --accent-soft:#EDF1FF; --danger:#D64545;
    --r:16px; --shadow:0 1px 2px rgba(20,24,35,.04),0 8px 24px rgba(20,24,35,.05);
  }
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  input,textarea{font:inherit;color:inherit}

  /* ---------- 顶部 ---------- */
  .bar{
    position:sticky; top:0; z-index:20;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
    background:rgba(243,244,247,.86);
    backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid transparent; transition:border-color .2s;
    display:flex; align-items:center; gap:10px;
  }
  .bar.scrolled{border-bottom-color:var(--line)}
  .bar h1{font-size:19px;font-weight:650;margin:0;letter-spacing:.2px;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .sub{font-size:12px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:0}
  .back{
    width:36px;height:36px;margin-left:-8px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:0 0 auto;
  }
  .back:active{background:#E8EAEF}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--ink2);flex:0 0 auto;
  }
  .icon-btn:active{background:#E8EAEF}

  main{padding:6px 16px calc(env(safe-area-inset-bottom) + 100px);max-width:560px;margin:0 auto}

  /* ---------- 概览 ---------- */
  .overview{
    background:linear-gradient(135deg,#20263A 0%,#2C3550 100%);
    border-radius:20px; padding:16px 18px; color:#fff; margin:8px 0 18px;
    box-shadow:0 6px 20px rgba(28,34,50,.16);
  }
  .overview .ov-t{font-size:12px;color:rgba(255,255,255,.62);letter-spacing:.4px}
  .overview .ov-n{font-size:30px;font-weight:700;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
  .overview .ov-n small{font-size:13px;font-weight:400;color:rgba(255,255,255,.6);margin-left:4px}
  .ov-row{display:flex;gap:22px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
  .ov-row div{font-size:12px;color:rgba(255,255,255,.62)}
  .ov-row b{display:block;font-size:16px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}

  .sec-t{font-size:12.5px;color:var(--ink3);letter-spacing:.6px;margin:0 2px 10px;display:flex;justify-content:space-between}

  /* ---------- 模块 / 子模块卡片 ---------- */
  .mod{
    background:var(--card); border-radius:var(--r); padding:14px 15px; margin-bottom:10px;
    display:flex; align-items:center; gap:13px; box-shadow:var(--shadow);
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .mod:active{transform:scale(.985);box-shadow:0 1px 2px rgba(20,24,35,.05)}
  .mod .glyph{
    width:44px;height:44px;border-radius:13px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:650;letter-spacing:0;
  }
  .mod .m-name{font-size:16.5px;font-weight:600;letter-spacing:.2px}
  .mod .m-sub{font-size:12px;color:var(--ink3);margin-top:2px}
  .mod .m-right{margin-left:auto;text-align:right;flex:0 0 auto}
  .mod .m-cnt{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .mod .m-cnt b{font-size:16px;font-weight:650;color:var(--ink)}
  .mod .m-err{font-size:11.5px;color:var(--ink3);margin-top:2px}
  .chev{color:#C8CCD6;margin-left:4px;flex:0 0 auto}

  /* ---------- 细分维度条 ---------- */
  .dim{
    background:var(--accent-soft); border-radius:10px; padding:9px 12px;
    font-size:12px; color:#2A4CB8; line-height:1.5; margin-bottom:10px;
    display:flex; gap:8px; align-items:flex-start;
  }
  .dim b{font-weight:600; flex:0 0 auto; font-size:11px; margin-top:1px}

  /* ---------- 子类筛选 ---------- */
  .chips{
    display:flex; gap:7px; overflow-x:auto; padding:2px 0 10px; margin:0 -16px; padding-left:16px; padding-right:16px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; display:flex; align-items:baseline; gap:5px;
    padding:7px 11px; border-radius:9px; background:#fff; color:var(--ink2);
    font-size:13px; white-space:nowrap; box-shadow:0 1px 2px rgba(20,24,35,.04);
  }
  .chip .c-n{font-size:11.5px;color:#AEB4C0;font-variant-numeric:tabular-nums}
  .chip.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(43,92,230,.28)}
  .chip.on .c-n{color:rgba(255,255,255,.75)}
  .chip:active{transform:scale(.97)}

  /* ---------- 子类分组标题 ---------- */
  .grp{padding:10px 2px 6px}
  .grp .g-t{display:flex;align-items:baseline;gap:6px}
  .grp .g-t span:first-child{font-size:13.5px;font-weight:600;letter-spacing:.2px}
  .grp .g-t span:last-child{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .grp .g-b{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.5}

  /* ---------- 知识点卡片 ---------- */
  .pt{
    background:var(--card); border-radius:var(--r); padding:13px 14px 12px 12px; margin-bottom:10px;
    display:flex; gap:12px; box-shadow:var(--shadow);
  }
  .chk{
    width:34px;height:34px;border-radius:50%;flex:0 0 auto;margin-top:1px;position:relative;
    border:1.8px solid #DCDFE7;background:#fff;color:#C2C7D2;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease,background .15s,border-color .15s,color .15s;
  }
  .chk:after{content:"";position:absolute;inset:-7px;border-radius:50%}
  .chk.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .chk:active{transform:scale(.86)}
  .chk.pop{animation:pop .34s cubic-bezier(.3,1.4,.5,1)}
  @keyframes pop{0%{transform:scale(.85)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
  .pt-main{flex:1;min-width:0}
  .pt-head{display:flex;align-items:baseline;gap:8px}
  .pt-name{font-size:16px;font-weight:600;letter-spacing:.1px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt-cnt{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .pt-cnt b{color:var(--accent);font-size:15px;font-weight:650}
  .pt-reason{
    font-size:13px;color:var(--ink2);margin-top:3px;display:flex;gap:6px;align-items:flex-start;
  }
  .pt-reason .tag{
    flex:0 0 auto;font-size:11px;line-height:1.6;color:#B4791C;background:#FBF3E2;border-radius:5px;
    padding:0 6px;margin-top:1px;letter-spacing:.4px;
  }
  .pt-reason span{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pt-foot{
    display:flex;align-items:center;gap:12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
    font-size:12px;color:var(--ink3);
  }
  .pt-foot .link{color:var(--accent);font-weight:500;display:flex;align-items:center;gap:2px}
  .pt-foot .sp{flex:1}

  /* ---------- 空状态 ---------- */
  .empty{text-align:center;padding:54px 24px;color:var(--ink3)}
  .empty .e-ic{
    width:58px;height:58px;border-radius:18px;background:#EDEFF4;color:#B3B9C6;
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  }
  .empty h3{font-size:15px;color:var(--ink2);font-weight:600;margin:0 0 6px}
  .empty p{font-size:13px;margin:0 0 16px;line-height:1.6}
  .btn-ghost{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 16px;border-radius:11px;background:#fff;box-shadow:var(--shadow);
    font-size:13.5px;font-weight:500;color:var(--accent);
  }
  .btn-ghost:active{background:#F6F7FA}

  /* ---------- 底部固定操作条 ---------- */
  .addbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
    background:linear-gradient(to top, rgba(243,244,247,.97) 55%, rgba(243,244,247,0));
    pointer-events:none;
  }
  .addbar button{
    pointer-events:auto;
    width:100%;max-width:528px;margin:0 auto;height:54px;border-radius:16px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 6px 18px rgba(43,92,230,.30),0 1px 3px rgba(43,92,230,.28);
    transition:transform .14s ease;
  }
  .addbar button:active{transform:scale(.985)}

  /* ---------- 详情 ---------- */
  .detail-hero{
    background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:8px 0 16px;
  }
  .crumb{font-size:11.5px;color:var(--ink3);letter-spacing:.3px;margin-bottom:6px}
  .detail-hero .d-name{font-size:21px;font-weight:650;letter-spacing:.2px;line-height:1.3}
  .detail-hero .d-reason{font-size:13.5px;color:var(--ink2);margin-top:8px;line-height:1.6}
  .detail-hero .d-reason em{font-style:normal;color:#B4791C;background:#FBF3E2;border-radius:5px;padding:0 6px;font-size:11px;line-height:1.7;margin-right:6px;display:inline-block}
  .d-stats{display:flex;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .d-stats .st{flex:1}
  .d-stats .st b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .d-stats .st span{font-size:11.5px;color:var(--ink3)}
  .d-stats .st b.acc{color:var(--accent)}
  .d-actions{display:flex;gap:10px;margin-top:14px}
  .btn-line{
    flex:1;height:40px;border-radius:11px;border:1px solid var(--line);background:#FBFBFD;
    font-size:13.5px;font-weight:500;color:var(--ink2);
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-line:active{background:#F2F4F8}
  .btn-line.danger{color:var(--danger);border-color:#F2DEDE;background:#FDF7F7}

  .tl-item{display:flex;gap:12px;padding:0 0 14px 0;position:relative}
  .tl-item .dot{
    width:26px;height:26px;border-radius:50%;flex:0 0 auto;
    background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;z-index:1;
  }
  .tl-item:not(:last-child):after{
    content:"";position:absolute;left:12.5px;top:26px;bottom:0;width:1.5px;background:var(--line);
  }
  .tl-item .tl-b{
    background:var(--card);border-radius:12px;padding:9px 6px 9px 13px;flex:1;box-shadow:0 1px 2px rgba(20,24,35,.04);
    display:flex;align-items:center;gap:8px;
  }
  .tl-item .tl-main{flex:1;min-width:0}
  .tl-item .tl-t{font-size:13.5px;font-weight:500}
  .tl-item .tl-note{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tl-item .tl-time{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .tl-more{
    width:30px;height:30px;border-radius:50%;flex:0 0 auto;color:#AEB4C0;
    display:flex;align-items:center;justify-content:center;
  }
  .tl-more:active{background:#F0F2F6}

  /* ---------- 底部弹层 ---------- */
  .mask{
    position:fixed;inset:0;background:rgba(16,19,28,.42);z-index:40;
    opacity:0;pointer-events:none;transition:opacity .22s;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  }
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;
    background:#fff;border-radius:22px 22px 0 0;
    padding:6px 18px calc(env(safe-area-inset-bottom) + 18px);
    transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
    max-width:560px;margin:0 auto;
    max-height:92vh;overflow-y:auto;
  }
  .sheet.show{transform:translateY(0)}
  .sheet .handle{width:38px;height:4px;border-radius:2px;background:#E1E4EA;margin:8px auto 14px}
  .sheet h2{font-size:17px;font-weight:620;margin:0 0 4px}
  .sheet .hint{font-size:12.5px;color:var(--ink3);margin:0 0 16px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px;font-weight:500}
  .field label i{color:var(--danger);font-style:normal;margin-left:2px}
  .field input,.field textarea{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:15px;background:#FAFBFC;outline:none;transition:border-color .15s,background .15s;
    resize:none;
  }
  .field input:focus,.field textarea:focus{border-color:var(--accent);background:#fff}
  .field input::placeholder,.field textarea::placeholder{color:#B6BCC8}
  .sub-pick{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 4px}
  .sub-pick button{
    flex:0 0 auto;padding:7px 11px;border-radius:9px;background:#F2F4F8;color:var(--ink2);
    font-size:12.5px;white-space:nowrap;
  }
  .sub-pick button.on{background:var(--accent);color:#fff;font-weight:600}
  .basis{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.5;min-height:17px}
  .quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .quick button{
    font-size:12px;padding:5px 10px;border-radius:8px;background:#F2F4F8;color:var(--ink2);
  }
  .quick button:active{background:#E7EAF1}
  .sheet-btns{display:flex;gap:10px;margin-top:18px}
  .sheet-btns button{height:46px;border-radius:13px;font-size:15px;font-weight:550;flex:1}
  .btn-cancel{background:#F2F4F8;color:var(--ink2)}
  .btn-ok{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(43,92,230,.28)}
  .btn-ok:disabled{background:#C6D2F0;box-shadow:none}
  .btn-ok:active{opacity:.9}

  /* 确认框 */
  .dialog{
    position:fixed;z-index:42;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);
    width:min(300px,84vw);background:#fff;border-radius:17px;padding:20px 18px 16px;
    opacity:0;pointer-events:none;transition:.2s;text-align:center;
    box-shadow:0 20px 50px rgba(16,19,28,.22);
  }
  .dialog.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .dialog h3{font-size:16px;margin:0 0 7px;font-weight:620}
  .dialog p{font-size:13px;color:var(--ink2);margin:0 0 16px;line-height:1.55;text-align:left}
  .dialog .row{display:flex;gap:9px}
  .dialog .row button{flex:1;height:42px;border-radius:11px;font-size:14.5px;font-weight:500}
  .dlg-del{background:#FDEEEE;color:var(--danger)}
  .dlg-no{background:#F2F4F8;color:var(--ink2)}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,14px);
    background:rgba(24,28,38,.94);color:#fff;font-size:13px;padding:10px 14px;border-radius:12px;
    z-index:50;opacity:0;pointer-events:none;transition:.24s;max-width:94vw;text-align:center;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast .tk{flex:0 0 auto;color:#6BE3A4}
  .toast #toastTxt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .toast .ta{flex:0 0 auto;margin-left:4px;padding:0 2px;color:#8FB8FF;font-weight:600;font-size:13px}

  /* 记录操作面板 */
  .act-h{font-size:12.5px;color:var(--ink3);text-align:center;margin:-2px 0 12px}
  .act-list{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .act-item{
    width:100%;height:50px;font-size:15px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;background:#fff;
  }
  .act-item + .act-item{border-top:1px solid var(--line)}
  .act-item.danger{color:var(--danger)}
  .act-item:active{background:#F7F8FA}

  .fade{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="bar" id="bar">
  <button class="back" id="backBtn" style="display:none" aria-label="返回">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1 id="title">公考错题本</h1>
  <button class="icon-btn" id="infoBtn" aria-label="说明">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.2"/></svg>
  </button>
</div>

<main id="view"></main>

<div class="addbar" id="addbar" style="display:none">
  <button data-act="add">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    新增知识点
  </button>
</div>

<div class="mask" id="mask"></div>

<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h2 id="sheetTitle">新增知识点</h2>
  <p class="hint" id="sheetHint">填写知识点名称与常见错误原因，便于复盘归因</p>

  <div class="field" id="subField" style="display:none">
    <label>子类 <i>*</i></label>
    <div class="sub-pick" id="subPick"></div>
    <div class="basis" id="subBasis"></div>
  </div>

  <div class="field">
    <label>知识点名称<i>*</i></label>
    <input id="inName" placeholder="如：增长率计算" maxlength="40" autocomplete="off">
  </div>
  <div class="field">
    <label>错误原因</label>
    <textarea id="inReason" rows="2" placeholder="如：公式混淆，把增长率当成增长量" maxlength="120"></textarea>
    <div class="quick" id="quick"></div>
  </div>
  <div class="sheet-btns">
    <button class="btn-cancel" id="sheetCancel">取消</button>
    <button class="btn-ok" id="sheetSave">保存</button>
  </div>
</div>

<div class="dialog" id="dialog">
  <h3 id="dlgTitle">确认删除</h3>
  <p id="dlgText"></p>
  <div class="row">
    <button class="dlg-no" id="dlgNo">取消</button>
    <button class="dlg-del" id="dlgYes">删除</button>
  </div>
</div>

<div class="toast" id="toast">
  <span class="tk">✓</span><span id="toastTxt"></span>
  <button class="ta" id="toastAct" style="display:none">撤销</button>
</div>

<div class="sheet" id="actSheet">
  <div class="handle"></div>
  <div class="act-h" id="actHead">第 1 次错误</div>
  <div class="act-list" id="actList"></div>
  <div class="sheet-btns">
    <button class="btn-cancel" id="actCancel">取消</button>
  </div>
</div>

<div class="sheet" id="noteSheet">
  <div class="handle"></div>
  <h2 id="noteTitle">第 1 次错误</h2>
  <p class="hint" id="noteSub">记录时间 —</p>
  <div class="field">
    <label>备注（这道题错在哪）</label>
    <textarea id="noteInput" rows="3" maxlength="120" placeholder="如：2023 联考 A 卷第 12 题，选项里「不」字看漏了"></textarea>
  </div>
  <div class="sheet-btns">
    <button class="btn-cancel" id="noteCancel">取消</button>
    <button class="btn-ok" id="noteSave">保存</button>
  </div>
</div>

<script>
/* =========================================================
   层级：模块 →（子模块 →）子类 → 知识点 → 错误记录
   point : {id, mod, g, s, name, reason, count, created}
   record: {id, pid, ts}
   ========================================================= */
const KEY = 'gk_cuoti_v2';

const MODULES = [
  { key:'zzll', name:'政治理论', short:'政', sub:'时政热点 · 理论 · 党建', color:'#C0392B', bg:'#FBEDEC' },
  { key:'cs',   name:'常识',     short:'常', sub:'法律 · 历史 · 科技 · 地理', color:'#B4791C', bg:'#FBF3E2' },
  { key:'yy',   name:'言语理解', short:'言', sub:'逻辑填空 · 片段阅读 · 排序', color:'#1F7A6B', bg:'#E6F4F0' },
  { key:'pd',   name:'判断推理', short:'判', sub:'图形 · 定义 · 类比 · 逻辑', color:'#4C4FBF', bg:'#ECECFB' },
  { key:'zl',   name:'资料分析', short:'资', sub:'ABRX · 速算 · 比重 · 平均数', color:'#2B6CB0', bg:'#E8F0FA' }
];

/* 子模块 / 子类目录：维度说明 + 每个子类的判定依据 */
const SUBS = {
  yy: [
    { key:'ltk', label:'逻辑填空', dim:'按「先看语境、再辨词语」的解题顺序细分', cats:[
      { key:'yjdy', label:'语境对应', basis:'解释、反对、并列、递进四类逻辑关系的呼应点没找准' },
      { key:'scby', label:'实词辨析', basis:'词义侧重、搭配范围、语体色彩三项辨析不清' },
      { key:'cyby', label:'成语辨析', basis:'望文生义、褒贬误用、对象误用、语义轻重' },
      { key:'glc',  label:'关联词与虚词', basis:'转折、因果、条件、递进等关联词搭配错位' },
      { key:'dkzh', label:'多空综合', basis:'多空题未按「先易后难、逐空排除」处理' }
    ]},
    { key:'pdyy', label:'片段阅读', dim:'按「设问方式」细分，设问决定找什么、找多细', cats:[
      { key:'zxll', label:'中心理解', basis:'主旨概括、意图判断，未抓中心句与主题词' },
      { key:'xpjd', label:'细节判断', basis:'偷换概念、无中生有、以偏概全、时态错误' },
      { key:'btlr', label:'标题填入', basis:'新闻、说明、议论三类文体对标题的凝练要求不同' },
      { key:'yybd', label:'语句表达', basis:'语句排序、语句填空、下文推断，抓首尾句与话题一致' },
      { key:'pwyd', label:'篇章阅读', basis:'多段材料综合，未先看题再回文定位' }
    ]}
  ],
  pd: [
    { key:'txxx', label:'图形推理', dim:'按「规律类型」细分，同时就是考场上的观察顺序', cats:[
      { key:'wzgl', label:'位置规律', basis:'平移、旋转、翻转，元素组成完全相同时优先看' },
      { key:'ysgl', label:'样式规律', basis:'遍历、加减同异、黑白叠加，元素组成相似时看' },
      { key:'slgl', label:'数量规律', basis:'点、线、面、角、素，元素组成凌乱时数' },
      { key:'sxgl', label:'属性规律', basis:'对称性、曲直性、开闭性，图形规整时看' },
      { key:'ltfg', label:'立体与分组', basis:'空间重构、截面图、三视图、分组分类' }
    ]},
    { key:'dypd', label:'定义判断', dim:'按「定义数量 + 设问方向」细分', cats:[
      { key:'ddyd', label:'单定义判断', basis:'只给一个定义，抓主体、客体、条件、方式、结果五要素' },
      { key:'ddby', label:'多定义辨析', basis:'多个定义并列，先对号入座再区分相近定义' },
      { key:'fwsw', label:'反向设问', basis:'「不属于」「不符合」类，须逐项验证后再排除' }
    ]},
    { key:'lbtl', label:'类比推理', dim:'按「关系层级」细分：先语义、再逻辑、最后语法', cats:[
      { key:'yygx', label:'语义关系', basis:'近义、反义、比喻象征，先看词义是否相关' },
      { key:'ljgx', label:'逻辑关系', basis:'全同、包含、交叉、并列、对应（因果、条件、目的）' },
      { key:'yfgx', label:'语法关系', basis:'主谓、动宾、偏正、并列，词性结构是否一致' },
      { key:'ejby', label:'二级辨析', basis:'一级关系排除不掉时，用词性、感情色彩、范围大小二次筛选' }
    ]},
    { key:'ljtl', label:'逻辑推理', dim:'按「题型与论证结构」细分', cats:[
      { key:'fytl', label:'翻译推理', basis:'假言命题、递推、逆否等价，先翻译成箭头再推' },
      { key:'zjtl', label:'真假推理', basis:'矛盾关系、反对关系，找不到矛盾就用代入排除' },
      { key:'jqxr', label:'加强削弱', basis:'先定论点论据，再看是搭桥拆桥还是补否论据' },
      { key:'rqjl', label:'日常结论', basis:'归纳推理与原因解释，选项不能过度推断' },
      { key:'jspj', label:'解释评价', basis:'解释矛盾现象、评价论证方法与逻辑漏洞' }
    ]}
  ]
};

const QUICK_REASONS = ['公式混淆','计算失误','审题不清','概念混淆','时间不够','选项陷阱','知识点遗忘','方法用错'];

const modOf = k => MODULES.find(m => m.key === k) || MODULES[0];
const subsOf = k => SUBS[k] || [];
const groupOf = (mod, g) => subsOf(mod).find(x => x.key === g) || null;
const catOf = (mod, g, s) => { const gs = groupOf(mod, g); return gs ? (gs.cats.find(c => c.key === s) || null) : null; };
const $ = id => document.getElementById(id);

let db = loadDB();
let route = { name:'home' };
let subFilter = '';        // 子模块内子类筛选
let editingId = null;      // 正在编辑的知识点 id
let draftSub = '';         // 弹窗里选中的子类
let draftGroup = null;     // 弹窗当前所属子模块（无子模块时为 null）

function loadDB(){
  try{
    const raw = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem('gk_cuoti_v1'));
    if (raw && Array.isArray(raw.points)) {
      // 兼容旧版数据：没有 g / s 的知识点视为挂在模块下
      const points = raw.points.map(p => ({
        ...p,
        g: p.g || '',
        s: p.s || ''
      }));
      return {
        points,
        records: Array.isArray(raw.records)
          ? raw.records.map(r => ({ ...r, n: r.n || '' }))
          : []
      };
    }
  }catch(e){ console.warn('读取本地数据失败', e); }
  return { points: [], records: [] };
}
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ alert('本地存储写入失败'); } }

const nextId = arr => arr.reduce((m, x) => Math.max(m, x.id), 0) + 1;
const pointsOf = k => db.points.filter(p => p.mod === k).sort((a,b) => b.created - a.created);
const pointsOfGroup = (k, g) => db.points.filter(p => p.mod === k && p.g === g).sort((a,b) => b.created - a.created);
const recordsOf = pid => db.records.filter(r => r.pid === pid).sort((a,b) => b.ts - a.ts);
const errTotalOf = k => { const ids = new Set(pointsOf(k).map(p => p.id)); return db.records.filter(r => ids.has(r.pid)).length; };
const errTotalOfGroup = (k, g) => { const ids = new Set(pointsOfGroup(k, g).map(p => p.id)); return db.records.filter(r => ids.has(r.pid)).length; };

function crumb(p){
  const m = modOf(p.mod), g = groupOf(p.mod, p.g), c = catOf(p.mod, p.g, p.s);
  return [m.name, g && g.label, c && c.label].filter(Boolean).join(' · ');
}

function fmt(ts){
  const d = new Date(ts), n = new Date();
  const p = x => String(x).padStart(2,'0');
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  const sameDay = d.toDateString() === n.toDateString();
  const y = new Date(n.getTime() - 864e5);
  if (sameDay) return `今天 ${hm}`;
  if (d.toDateString() === y.toDateString()) return `昨天 ${hm}`;
  if (d.getFullYear() === n.getFullYear()) return `${d.getMonth()+1}月${d.getDate()}日 ${hm}`;
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${hm}`;
}

/* ================= 渲染 ================= */
function render(){
  const view = $('view');
  $('bar').classList.remove('scrolled');
  window.scrollTo(0, 0);

  if (route.name === 'home')        renderHome(view);
  else if (route.name === 'groups') renderGroups(view, route.mod);
  else if (route.name === 'group')  renderGroup(view, route.mod, route.g);
  else if (route.name === 'module') renderModule(view, route.mod);
  else                              renderDetail(view, route.id);

  view.classList.remove('fade'); void view.offsetWidth; view.classList.add('fade');
}

/* --------- 主页 --------- */
function renderHome(view){
  $('title').innerHTML = '公考错题本';
  $('backBtn').style.display = 'none';
  $('addbar').style.display = 'none';

  const total = db.records.length;
  const pts = db.points.length;
  const recent = db.records.length ? Math.max(...db.records.map(r => r.ts)) : null;

  view.innerHTML = `
    <div class="overview">
      <div class="ov-t">累计错误记录</div>
      <div class="ov-n">${total}<small>次</small></div>
      <div class="ov-row">
        <div>知识点<b>${pts} 个</b></div>
        <div>覆盖模块<b>${MODULES.filter(m=>pointsOf(m.key).length).length} / 5</b></div>
        <div>最近记录<b>${recent ? fmt(recent) : '—'}</b></div>
      </div>
    </div>
    <div class="sec-t"><span>选择模块</span><span>共 5 个模块</span></div>
    ${MODULES.map(m => {
      const gs = subsOf(m.key);
      const ps = pointsOf(m.key), c = errTotalOf(m.key);
      const right = gs.length
        ? `<div class="m-cnt"><b>${gs.length}</b> 个子模块</div>`
        : `<div class="m-cnt"><b>${ps.length}</b> 个知识点</div>`;
      return `<div class="mod" data-act="open" data-key="${m.key}">
        <div class="glyph" style="background:${m.bg};color:${m.color}">${m.short}</div>
        <div>
          <div class="m-name">${m.name}</div>
          <div class="m-sub">${m.sub}</div>
        </div>
        <div class="m-right">${right}<div class="m-err">累计 ${c} 次错误</div></div>
        <svg class="chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>`;
    }).join('')}
  `;
}

/* --------- 子模块列表 --------- */
function renderGroups(view, modKey){
  const m = modOf(modKey), gs = subsOf(modKey);
  $('title').innerHTML = `${m.name}<span class="sub">${gs.length} 个子模块 · ${pointsOf(modKey).length} 个知识点</span>`;
  $('backBtn').style.display = 'flex';
  $('addbar').style.display = 'none';

  view.innerHTML = `
    <div class="sec-t"><span>选择子模块</span><span>共 ${gs.length} 个 · 按题型划分</span></div>
    ${gs.map(g => {
      const c = errTotalOfGroup(modKey, g.key), n = pointsOfGroup(modKey, g.key).length;
      return `<div class="mod" data-act="open-group" data-mod="${modKey}" data-g="${g.key}">
        <div class="glyph" style="background:${m.bg};color:${m.color}">${g.label.slice(0,1)}</div>
        <div>
          <div class="m-name">${g.label}</div>
          <div class="m-sub">${g.cats.length} 个子类</div>
        </div>
        <div class="m-right">
          <div class="m-cnt"><b>${n}</b> 个知识点</div>
          <div class="m-err">累计 ${c} 次错误</div>
        </div>
        <svg class="chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>`;
    }).join('')}
  `;
}

/* --------- 子模块内：按子类分组的清单 --------- */
function renderGroup(view, modKey, gKey){
  const m = modOf(modKey), g = groupOf(modKey, gKey);
  if (!g){ route = { name:'groups', mod: modKey }; return render(); }

  const all = pointsOfGroup(modKey, gKey);
  $('title').innerHTML = `${g.label}<span class="sub">${g.cats.length} 个子类 · ${all.length} 个知识点</span>`;
  $('backBtn').style.display = 'flex';
  $('addbar').style.display = 'block';

  if (!all.length){
    view.innerHTML = `
      <div class="dim"><b>细分维度</b><span>${g.dim}</span></div>
      <div class="chips">${chipHtml('', '全部', 0, subFilter === '')}${g.cats.map(c => chipHtml(c.key, c.label, 0, subFilter === c.key)).join('')}</div>
      <div class="empty" style="padding:34px 20px">
        <div class="e-ic">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3H19v18H6.5A2.5 2.5 0 004 23V5.5z"/><path d="M8 8h7M8 12h5"/></svg>
        </div>
        <h3>${g.label}还没有知识点</h3>
        <p>新增时选好子类，清单会自动按子类分组。</p>
        <button class="btn-ghost" data-act="add">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          新增第一个知识点
        </button>
      </div>`;
    return;
  }

  const used = g.cats.filter(c => all.some(p => p.s === c.key));
  const uncat = all.filter(p => !g.cats.some(c => c.key === p.s));
  const shown = subFilter ? used.filter(c => c.key === subFilter) : used;
  const showUncat = !subFilter && uncat.length > 0;

  let body = '';
  shown.forEach(c => {
    const ps = all.filter(p => p.s === c.key);
    body += `<div class="grp"><div class="g-t"><span>${c.label}</span><span>${ps.length} 个</span></div><div class="g-b">${c.basis}</div></div>`;
    body += ps.map(p => pointHtml(p)).join('');
  });
  if (showUncat){
    body += `<div class="grp"><div class="g-t"><span>未分类</span><span>${uncat.length} 个</span></div><div class="g-b">早期录入或编辑后未指定子类，点进详情可重新归类</div></div>`;
    body += uncat.map(p => pointHtml(p)).join('');
  }
  if (!shown.length && !showUncat){
    body = `<div class="empty" style="padding:34px 20px"><h3>这个子类下还没有知识点</h3><p style="margin:0">点右下角新增，会自动归到当前选中的子类</p></div>`;
  }

  view.innerHTML = `
    <div class="dim"><b>细分维度</b><span>${g.dim}</span></div>
    <div class="chips">
      ${chipHtml('', '全部', all.length, subFilter === '')}
      ${g.cats.map(c => chipHtml(c.key, c.label, all.filter(p => p.s === c.key).length, subFilter === c.key)).join('')}
    </div>
    ${body}
  `;
}

function chipHtml(key, label, n, on){
  return `<button class="chip ${on ? 'on' : ''}" data-act="filter" data-key="${key}">${label}<span class="c-n">${n}</span></button>`;
}

function pointHtml(p){
  const c = p.count, rc = recordsOf(p.id).length;
  const latest = recordsOf(p.id)[0];
  return `<div class="pt" data-act="detail" data-id="${p.id}">
    <button class="chk ${c>0?'on':''}" data-act="check" data-id="${p.id}" aria-label="记一次错">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
    </button>
    <div class="pt-main">
      <div class="pt-head">
        <span class="pt-name">${esc(p.name)}</span>
        <span class="pt-cnt"><b>${c}</b> 次</span>
      </div>
      <div class="pt-reason"><span class="tag">错因</span><span>${esc(p.reason || '未填写具体原因')}</span></div>
      <div class="pt-foot">
        <span class="link" data-act="detail" data-id="${p.id}">
          查看 ${rc} 条记录
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
        <span class="sp"></span>
        <span>${latest ? '截止 ' + fmt(latest.ts) : '未记录'}</span>
      </div>
    </div>
  </div>`;
}

/* --------- 模块页（无子模块） --------- */
function renderModule(view, modKey){
  const m = modOf(modKey), ps = pointsOf(modKey);
  $('title').innerHTML = `${m.name}<span class="sub">${ps.length} 个知识点 · 累计 ${errTotalOf(modKey)} 次</span>`;
  $('backBtn').style.display = 'flex';
  $('addbar').style.display = 'block';

  if (!ps.length){
    view.innerHTML = `
      <div class="empty">
        <div class="e-ic">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 016.5 3H19v18H6.5A2.5 2.5 0 004 23V5.5z"/><path d="M8 8h7M8 12h5"/>
          </svg>
        </div>
        <h3>还没有知识点</h3>
        <p>把「${m.name}」的易错考点加进来，勾选一次就记一次错，<br>累计次数会告诉你哪里最该补。</p>
        <button class="btn-ghost" data-act="add">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          新增第一个知识点
        </button>
      </div>`;
    return;
  }
  view.innerHTML = ps.map(p => pointHtml(p)).join('');
}

/* --------- 详情页 --------- */
function renderDetail(view, id){
  const p = db.points.find(x => x.id === id);
  if (!p){ route = { name:'home' }; return render(); }
  const rs = recordsOf(p.id);
  const m = modOf(p.mod);
  const g = groupOf(p.mod, p.g);
  $('title').innerHTML = `错误记录<span class="sub">${g ? m.name + ' · ' + g.label : m.name}</span>`;
  $('backBtn').style.display = 'flex';
  $('addbar').style.display = 'none';

  const first = rs.length ? fmt(rs[rs.length-1].ts) : '—';

  view.innerHTML = `
    <div class="detail-hero">
      <div class="crumb">${crumb(p)}</div>
      <div class="d-name">${esc(p.name)}</div>
      <div class="d-reason"><em>错误原因</em>${esc(p.reason || '未填写具体原因')}</div>
      <div class="d-stats">
        <div class="st"><b class="acc">${p.count}</b><span>累计错误次数</span></div>
        <div class="st"><b>${rs.length}</b><span>错误记录条数</span></div>
      </div>
      <div class="d-actions">
        <button class="btn-line" data-act="check-here" data-id="${p.id}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
          再记一次错
        </button>
        <button class="btn-line" data-act="edit" data-id="${p.id}">编辑</button>
        <button class="btn-line danger" data-act="del-point" data-id="${p.id}">删除</button>
      </div>
    </div>
    <div class="sec-t"><span>错误记录 · 由近到远</span><span>${first === '—' ? '' : '首次 ' + first}</span></div>
    ${rs.length ? `<div class="tl">${rs.map((r, i) => {
      const n = rs.length - i;
      return `
      <div class="tl-item">
        <div class="dot">${n}</div>
        <div class="tl-b">
          <div class="tl-main">
            <div class="tl-t">第 ${n} 次错误</div>
            ${r.n ? `<div class="tl-note">${esc(r.n)}</div>` : ''}
          </div>
          <span class="tl-time">${fmt(r.ts)}</span>
          <button class="tl-more" data-act="rec-menu" data-id="${r.id}" aria-label="这条记录的操作">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
        </div>
      </div>`;
    }).join('')}</div>`
    : `<div class="empty" style="padding:36px 20px">
         <h3 style="margin-bottom:4px">还没有错误记录</h3>
         <p style="margin:0">回到清单勾选一次，就会生成第一条记录</p>
       </div>`}
  `;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= 交互 ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'open'){
    const k = el.dataset.key;
    route = subsOf(k).length ? { name:'groups', mod:k } : { name:'module', mod:k };
    subFilter = ''; render();
  }
  else if (act === 'open-group'){ route = { name:'group', mod: el.dataset.mod, g: el.dataset.g }; subFilter = ''; render(); }
  else if (act === 'filter'){ subFilter = el.dataset.key; renderGroup($('view'), route.mod, route.g); }
  else if (act === 'detail' && el.dataset.id){ route = { name:'detail', id: Number(el.dataset.id) }; render(); }
  else if (act === 'add'){ openSheet(null); }
  else if (act === 'edit'){ openSheet(Number(el.dataset.id)); }
  else if (act === 'check'){ checkIn(el, Number(el.dataset.id)); }
  else if (act === 'check-here'){ checkIn(null, Number(el.dataset.id)); }
  else if (act === 'del-point'){ askDelete(Number(el.dataset.id)); }
  else if (act === 'rec-menu'){ openRecMenu(Number(el.dataset.id)); }
});

$('backBtn').onclick = () => {
  if (route.name === 'detail'){
    const p = db.points.find(x => x.id === route.id);
    if (p && p.g) { route = { name:'group', mod: p.mod, g: p.g }; subFilter = ''; }
    else if (p) route = { name:'module', mod: p.mod };
    else route = { name:'home' };
  }
  else if (route.name === 'group') route = { name:'groups', mod: route.mod };
  else if (route.name === 'groups') route = { name:'home' };
  else route = { name:'home' };
  render();
};
window.addEventListener('scroll', () => {
  $('bar').classList.toggle('scrolled', window.scrollY > 4);
}, { passive:true });

/* 勾选一次 → 次数 +1 → 新增一条记录；误触可在提示条里撤销 */
function checkIn(btn, id){
  const p = db.points.find(x => x.id === id);
  if (!p) return;
  p.count = (p.count || 0) + 1;
  const rec = { id: nextId(db.records), pid: p.id, ts: Date.now(), n: '' };
  db.records.push(rec);
  saveDB();

  if (btn){ btn.classList.add('pop'); setTimeout(() => btn.classList.remove('pop'), 360); }
  toast(`已记录「${p.name}」第 ${p.count} 次`, () => undoRecord(p.id, rec.id));

  if (route.name === 'group') updateCard(p);
  else if (route.name === 'module') updateCard(p);
  else if (route.name === 'detail') renderDetail($('view'), p.id);
}

/* 撤销刚勾选的那一次 */
function undoRecord(pointId, recId){
  const p = db.points.find(x => x.id === pointId);
  if (!p) return;
  db.records = db.records.filter(r => r.id !== recId);
  p.count = Math.max(0, p.count - 1);
  saveDB();
  if (route.name === 'detail') renderDetail($('view'), p.id);
  else if (route.name === 'group') renderGroup($('view'), route.mod, route.g);
  else if (route.name === 'module') renderModule($('view'), route.mod);
  toast('已撤销这次记录');
}

function updateCard(p){
  const card = document.querySelector(`.pt[data-id="${p.id}"]`);
  if (!card){
    if (route.name === 'group') renderGroup($('view'), route.mod, route.g);
    else renderModule($('view'), route.mod);
    return;
  }
  card.querySelector('.chk').classList.add('on');
  card.querySelector('.pt-cnt b').textContent = p.count;
  const rc = recordsOf(p.id).length;
  card.querySelector('.pt-foot .link').innerHTML =
    `查看 ${rc} 条记录<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>`;
  card.querySelector('.pt-foot span:last-child').textContent = '截止 ' + fmt(recordsOf(p.id)[0].ts);

  if (route.name === 'group' && route.mod && route.g){
    const g = groupOf(route.mod, route.g);
    const n = pointsOfGroup(route.mod, route.g).length;
    $('title').innerHTML = `${g.label}<span class="sub">${g.cats.length} 个子类 · ${n} 个知识点</span>`;
  } else {
    const key = p.mod;
    $('title').innerHTML = `${modOf(key).name}<span class="sub">${pointsOf(key).length} 个知识点 · 累计 ${errTotalOf(key)} 次</span>`;
  }
}

/* 弹层：新增 / 编辑 */
function openSheet(id){
  editingId = id;
  const p = id ? db.points.find(x => x.id === id) : null;

  // 当前所在子模块（详情页则取该知识点的子模块）
  let modKey = route.mod || '';
  let gKey = route.g || '';
  if (id && p){ modKey = p.mod; gKey = p.g; }
  const g = groupOf(modKey, gKey);

  $('sheetTitle').textContent = p ? '编辑知识点' : '新增知识点';
  $('sheetHint').textContent = p
    ? '修改子类、名称或错误原因，累计次数与记录不受影响'
    : (g ? `添加到「${modOf(modKey).name} · ${g.label}」` : `添加到「${modOf(modKey).name}」`);
  $('inName').value = p ? p.name : '';
  $('inReason').value = p ? (p.reason || '') : '';
  $('quick').innerHTML = QUICK_REASONS.map(r => `<button data-q="${r}">${r}</button>`).join('');

  // 子类选择
  const subField = $('subField'), pick = $('subPick');
  draftGroup = g;
  if (g){
    draftSub = (p && p.s) || (id ? '' : (subFilter || g.cats[0].key));
    if (!g.cats.some(c => c.key === draftSub)) draftSub = g.cats[0].key;
    subField.style.display = '';
    pick.innerHTML = g.cats.map(c => `<button data-s="${c.key}" class="${draftSub===c.key?'on':''}">${c.label}</button>`).join('');
    $('subBasis').textContent = '判定依据：' + (g.cats.find(c => c.key === draftSub)?.basis || '');
  } else {
    draftSub = '';
    subField.style.display = 'none';
  }

  $('sheetSave').disabled = !$('inName').value.trim();
  showSheet(true);
  setTimeout(() => $('inName').focus(), 260);
}
function showSheet(on){
  ['actSheet','noteSheet'].forEach(id => $(id).classList.remove('show'));
  $('mask').classList.toggle('show', on);
  $('sheet').classList.toggle('show', on);
}
function closeAllLayers(){
  ['sheet','actSheet','noteSheet'].forEach(id => $(id).classList.remove('show'));
  $('dialog').classList.remove('show');
  $('mask').classList.remove('show');
}
$('mask').onclick = closeAllLayers;

/* ---------- 单条错误记录：备注 / 删除 ---------- */
let noteRecId = null;

function openRecMenu(recId){
  const r = db.records.find(x => x.id === recId);
  if (!r) return;
  const p = db.points.find(x => x.id === r.pid);
  const rs = recordsOf(r.pid);
  const order = rs.length - rs.findIndex(x => x.id === r.id);

  $('actHead').textContent = `${p ? p.name : ''} · 第 ${order} 次错误`;
  $('actList').innerHTML = `
    <button class="act-item" data-rec="note">添加/修改备注</button>
    <button class="act-item danger" data-rec="del">删除这一次</button>`;
  $('actList').onclick = e => {
    const b = e.target.closest('[data-rec]');
    if (!b) return;
    if (b.dataset.rec === 'note'){ openNote(r.id); }
    else { askDeleteRecord(r.id); }
  };
  ['sheet','noteSheet'].forEach(id => $(id).classList.remove('show'));
  $('mask').classList.add('show');
  $('actSheet').classList.add('show');
}
$('actCancel').onclick = () => { $('actSheet').classList.remove('show'); $('mask').classList.remove('show'); };

function openNote(recId){
  noteRecId = recId;
  const r = db.records.find(x => x.id === recId);
  if (!r) return;
  const rs = recordsOf(r.pid);
  const order = rs.length - rs.findIndex(x => x.id === r.id);
  $('noteTitle').textContent = `第 ${order} 次错误`;
  $('noteSub').textContent = `记录时间 ${fmt(r.ts)} · 可补写这道题错在哪`;
  $('noteInput').value = r.n || '';
  $('actSheet').classList.remove('show');
  $('mask').classList.add('show');
  $('noteSheet').classList.add('show');
  setTimeout(() => $('noteInput').focus(), 260);
}
$('noteCancel').onclick = () => { $('noteSheet').classList.remove('show'); $('mask').classList.remove('show'); };
$('noteSave').onclick = () => {
  const r = db.records.find(x => x.id === noteRecId);
  if (!r) return;
  r.n = $('noteInput').value.trim();
  saveDB();
  $('noteSheet').classList.remove('show');
  $('mask').classList.remove('show');
  if (route.name === 'detail') renderDetail($('view'), r.pid);
  toast(r.n ? '备注已保存' : '已清空备注');
};

function askDeleteRecord(recId){
  const r = db.records.find(x => x.id === recId);
  if (!r) return;
  $('actSheet').classList.remove('show');
  const rs = recordsOf(r.pid);
  const order = rs.length - rs.findIndex(x => x.id === r.id);
  openDialog({
    title: `删除第 ${order} 次记录`,
    text: `这条记录的时间是 ${fmt(r.ts)}。删除后累计错误次数会减 1，其余记录的「第几次」会重新排列，此操作不可恢复。`,
    okText: '删除',
    showCancel: true,
    onOk: () => {
      db.records = db.records.filter(x => x.id !== recId);
      const p = db.points.find(x => x.id === r.pid);
      if (p) p.count = Math.max(0, p.count - 1);
      saveDB();
      hideDialog();
      if (route.name === 'detail') renderDetail($('view'), r.pid);
      toast(`已删除第 ${order} 次记录`);
    }
  });
}

$('subPick').addEventListener('click', e => {
  const b = e.target.closest('[data-s]'); if (!b) return;
  draftSub = b.dataset.s;
  [...e.currentTarget.querySelectorAll('button')].forEach(x => x.classList.toggle('on', x.dataset.s === draftSub));
  const cat = draftGroup && draftGroup.cats.find(c => c.key === draftSub);
  $('subBasis').textContent = cat ? '判定依据：' + cat.basis : '';
});

$('inName').addEventListener('input', () => { $('sheetSave').disabled = !$('inName').value.trim(); });
$('quick').addEventListener('click', e => {
  const b = e.target.closest('[data-q]'); if (!b) return;
  const v = b.dataset.q;
  const cur = $('inReason').value.trim();
  $('inReason').value = cur ? (cur.includes(v) ? cur : cur + '，' + v) : v;
});
$('sheetCancel').onclick = () => showSheet(false);
$('sheetSave').onclick = () => {
  const name = $('inName').value.trim();
  if (!name) return;
  const reason = $('inReason').value.trim();

  if (editingId){
    const p = db.points.find(x => x.id === editingId);
    if (p){ p.name = name; p.reason = reason; if (draftSub) p.s = draftSub; }
    saveDB(); showSheet(false);
    toast('已更新知识点');
    if (route.name === 'detail') renderDetail($('view'), editingId);
    else if (route.name === 'group') renderGroup($('view'), route.mod, route.g);
    else if (route.name === 'module') renderModule($('view'), route.mod);
  } else {
    const modKey = route.mod || 'zl';
    const gKey = route.g || '';
    const np = { id: nextId(db.points), mod: modKey, g: gKey, s: draftSub, name, reason, count: 0, created: Date.now() };
    db.points.push(np); saveDB(); showSheet(false);
    const g = groupOf(modKey, gKey);
    toast(g ? `已添加到「${g.label}」` : `已添加到「${modOf(modKey).name}」`, () => {
      db.points = db.points.filter(x => x.id !== np.id);
      db.records = db.records.filter(r => r.pid !== np.id);
      saveDB();
      if (route.name === 'group') renderGroup($('view'), route.mod, route.g);
      else if (route.name === 'module') renderModule($('view'), route.mod);
      else render();
      toast('已撤销这次添加');
    });
    if (route.name === 'group') renderGroup($('view'), route.mod, route.g);
    else render();
  }
};

/* 删除确认 */
let dlgAction = null;
function openDialog({ title, text, okText, showCancel, onOk }){
  $('dlgTitle').textContent = title;
  $('dlgText').innerHTML = text;
  $('dlgYes').textContent = okText || '删除';
  $('dlgYes').className = showCancel === false ? 'dlg-no' : 'dlg-del';
  $('dlgNo').style.display = showCancel === false ? 'none' : '';
  dlgAction = onOk || null;
  $('dialog').classList.toggle('show', true);
  $('mask').classList.add('show');
}
function hideDialog(){
  $('dialog').classList.remove('show');
  if (!$('sheet').classList.contains('show')) $('mask').classList.remove('show');
}

function askDelete(id){
  const p = db.points.find(x => x.id === id);
  if (!p) return;
  openDialog({
    title: '删除知识点',
    text: `删除「${esc(p.name)}」后，它的 ${p.count} 条累计记录也会一并清除，此操作不可恢复。`,
    okText: '删除',
    showCancel: true,
    onOk: () => {
      db.points = db.points.filter(x => x.id !== id);
      db.records = db.records.filter(r => r.pid !== id);
      saveDB(); hideDialog();
      if (p.g) { route = { name:'group', mod: p.mod, g: p.g }; subFilter = ''; }
      else route = { name:'module', mod: p.mod };
      render(); toast('已删除');
    }
  });
}
$('dlgNo').onclick = hideDialog;
$('dlgYes').onclick = () => {
  const fn = dlgAction;
  dlgAction = null;
  if (fn) fn(); else hideDialog();
};

/* toast：可选带「撤销」动作 */
let toastTimer, undoAction = null;
function toast(msg, undo){
  $('toastTxt').textContent = msg;
  undoAction = undo || null;
  $('toastAct').style.display = undo ? '' : 'none';
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    $('toast').classList.remove('show');
    undoAction = null;
  }, undo ? 4500 : 1800);
}
$('toastAct').onclick = () => {
  const fn = undoAction;
  undoAction = null;
  $('toast').classList.remove('show');
  clearTimeout(toastTimer);
  if (fn) fn();
};

/* 说明 */
$('infoBtn').onclick = () => {
  openDialog({
    title: '使用说明',
    text: '① 主界面固定五个模块；<b>言语理解、判断推理</b>下面还有一层子模块。<br>' +
          '② 子模块按题型划分，子类按解法差异划分，分组标题上写着该子类的判定依据。<br>' +
          '③ 新增时先选子类，填名称与错误原因，清单会自动按子类分组。<br>' +
          '④ 清单左侧圆圈<b>勾选一次＝记一次错</b>，累计次数 +1，并生成一条带时间的记录。<br>' +
          '⑤ 政治理论、常识、资料分析考点线性，不设子模块，直接在模块下记知识点。<br><br>' +
          '数据保存在本机浏览器，关闭后不会丢失。',
    okText: '知道了',
    showCancel: false,
    onOk: hideDialog
  });
};

/* 启动 */
render();
</script>
</body>
